<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>土木試験アプリ</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<h1>📘 土木試験対策アプリ</h1>

<div id="year-select">

    <button onclick="loadYear('R3')">
        令和3年
    </button>

    <button onclick="loadYear('R4')">
        令和4年
    </button>

    <button onclick="loadYear('R5')">
        令和5年
    </button>

    <button onclick="loadYear('R6')">
        令和6年
    </button>

    <button onclick="loadYear('R7')">
        令和7年
    </button>

    <button onclick="loadAllQuestions()">
        全問題
    </button>

</div>

<div id="quiz-container">

    <div id="question-number"></div>

    <!-- 進捗表示 -->
<div id="progress-text"></div>

<!-- 進捗バー -->
<div id="progress-container">
    <div id="progress-bar"></div>
</div>

    <h2 id="question"></h2>

    <img
id="question-image"
style="display:none;"
alt="問題図">

    <div id="choices"></div>

</div>

<div id="button-area">

    <button id="prev-btn">前へ</button>

    <button id="next-btn">次へ</button>

    <button id="skip-btn">スキップ</button>

    <button id="score-btn">
        採点する
    </button>

</div>

<div id="result"></div>

<div id="unanswered-area"></div>

<div id="answer-review"></div>

<button
id="restart-btn"
style="display:none;"
>
もう一度挑戦
</button>

<script src="js/r3.js"></script>
<script src="js/r4.js"></script>
<script src="js/r5.js"></script>
<script src="js/r6.js"></script>
<script src="js/r7.js"></script>

<script src="js/questions.js"></script>
<script src="js/script.js"></script>
</body>
</html>
